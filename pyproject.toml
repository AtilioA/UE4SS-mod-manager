[project]
name = "ue4ss-modmanager"
version = "1.2.0"
description = "UE4SS mod manager, forked from gtkacz's."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
    "loguru>=0.7.3",
    "pillow>=12.2.0",
    "tkinterdnd2>=0.4.3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "ruff>=0.15.9",
    "ty>=0.0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
ue4ss-modmanager = "src.main:main"
build = "build:main"
